networks:
  gnp-mgmt:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.60.0/24
services:
  # Troubleshooting container
  # Uncomment to run it
  # netshoot:
  #   image: ghcr.io/nicolaka/netshoot:latest
  #   networks:
  #     - gnp-mgmt
  #   command: "sleep 36000"
  gnmic-ingestor:
    image: ghcr.io/openconfig/gnmic:0.45.0
    ports:
      - 9804:9804
    volumes:
      - ./gnmic/gnmic-ingestor.yaml:/app/gnmic.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock # allows docker loader in gnmic config, only needed for demo containerlab networks
    command: "--config /app/gnmic.yaml --log subscribe"
    networks:
      gnp-mgmt: {}
    depends_on:
      prometheus:
        condition: service_healthy

  gnmic-emitter:
    image: ghcr.io/openconfig/gnmic:0.45.0
    ports:
      - 9806:9804
    volumes:
      - ./gnmic/gnmic-emitter.yaml:/app/gnmic.yaml:ro
    command: "--config /app/gnmic.yaml --log subscribe"
    networks:
      - gnp-mgmt
    depends_on:
      prometheus:
        condition: service_healthy

  nats:
    image: nats:2.12.4
    ports:
      - 4222:4222
      - 6222:6222
      - 8222:8222
    volumes:
      - ./nats/nats-server.conf:/nats-server.conf
      - ./nats/datastore:/data
    command: "-c /nats-server.conf"
    networks:
      - gnp-mgmt

  nats-exporter:
    image: natsio/prometheus-nats-exporter:0.19.1
    ports:
      - 7777:7777
    command: "-jsz=all -varz http://nats:8222"
    networks:
      - gnp-mgmt

  prometheus:
    image: prom/prometheus:v3.5.0
    #user: 65534:65534
    ports:
      - 9090:9090
    volumes:
      - ./prometheus/:/etc/prometheus/
    command: |
      --config.file=/etc/prometheus/prometheus.yaml
      --web.console.libraries=/usr/share/prometheus/console_libraries
      --web.console.templates=/usr/share/prometheus/consoles
      --web.enable-remote-write-receiver
    networks:
      - gnp-mgmt
    healthcheck:
      test: ["CMD", "promtool", "check", "healthy"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Loki runs on the remote VM — see vm/compose.yaml and `make vm-deploy`
  # Grafana queries it via LOKI_URL (default: http://10.10.20.15:3100)

  alertmanager:
    image: prom/alertmanager:v0.28.1
    ports:
      - 9093:9093
    volumes:
      - ./alertmanager/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
    command: >
      --config.file=/etc/alertmanager/alertmanager.yaml
      --web.listen-address=:9093
      --log.level=info
    environment:
      - WEBHOOK_RECEIVER_URL=${WEBHOOK_RECEIVER_URL:-http://webhook-receiver:8080/alert}
    networks:
      - gnp-mgmt
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9093/-/healthy",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  webhook-receiver:
    build: ./webhook
    ports:
      - 8080:8080
    environment:
      - LANGGRAPH_API_URL=${LANGGRAPH_API_URL:-http://host.docker.internal:2024}
      - LANGGRAPH_ASSISTANT_ID=${LANGGRAPH_ASSISTANT_ID:-agent}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - gnp-mgmt
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  grafana:
    image: grafana/grafana:12.3.5
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=grafana
      - GF_UNIFIED_ALERTING_ENABLED=true
      - GF_PLUGINS_PREINSTALL_SYNC=andrewbmchugh-flow-panel@1.20.1
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=andrewbmchugh-flow-panel
      - LOKI_URL=${LOKI_URL:-http://10.10.20.15:3100}
    volumes:
      - ./grafana/provisioning/datasource.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./grafana/provisioning/dashboards.yaml:/etc/grafana/provisioning/dashboards/default.yaml:ro
      - ./grafana/dashboards/:/var/lib/grafana/dashboards/
      - ./grafana/xrd-topology.svg:/usr/share/grafana/public/img/xrd-topology.svg:ro
    ports:
      - 3000:3000
    networks:
      gnp-mgmt: {}
