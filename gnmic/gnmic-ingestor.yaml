subscriptions:
  # ── XRd / IOS-XR 25.3.1 ─────────────────────────────────────────────────

  # Interface operational state (on_change for immediate alert triggering)
  xrd-if-states:
    mode: stream
    stream-mode: on_change
    heartbeat-interval: 60s
    paths:
      - /interfaces/interface[name=*]/state/oper-status
      - /interfaces/interface[name=*]/state/admin-status
    outputs:
      - nats-xrd-out

  # Interface traffic statistics (sampled)
  xrd-if-stats:
    mode: stream
    stream-mode: sample
    sample-interval: 30s
    paths:
      - /interfaces/interface[name=*]/state/counters
    outputs:
      - nats-xrd-out

  # ISIS adjacency state (on_change for immediate alert triggering)
  # XR native YANG — OC adjacency sub-paths are not navigable via gNMI on XRd 25.3.1
  # neighbor-state values: isis-adj-up-state (1) / isis-adj-down-state (0)
  # heartbeat-interval: 10s (reduced from 60s) so last_over_time[15s] in the
  # ISIS Adjacency State panel detects absence within ~15s instead of ~70s.
  xrd-isis-adjacency:
    mode: stream
    stream-mode: on_change
    heartbeat-interval: 10s
    paths:
      - Cisco-IOS-XR-clns-isis-oper:isis/instances/instance[instance-name=*]/neighbors/neighbor
    outputs:
      - nats-xrd-out

  # ISIS convergence data — XR native YANG
  # OC global/counters sub-path not navigable via gNMI on XRd 25.3.1
  xrd-isis-stats:
    mode: stream
    stream-mode: sample
    sample-interval: 30s
    paths:
      - Cisco-IOS-XR-clns-isis-oper:isis/instances/instance[instance-name=*]/topologies/topology[af-name=ipv4][saf-name=unicast]/frr-summary
    outputs:
      - nats-xrd-out

  # BGP session state (on_change)
  # XR native YANG — OC BGP neighbor state sub-paths not navigable via gNMI on XRd 25.3.1
  # connection-state values: bgp-st-estab (1) / bgp-st-idle, bgp-st-connect, bgp-st-active (0)
  xrd-bgp-sessions:
    mode: stream
    stream-mode: on_change
    heartbeat-interval: 60s
    paths:
      - Cisco-IOS-XR-ipv4-bgp-oper:bgp/instances/instance[instance-name=default]/instance-active/default-vrf/neighbors/neighbor[neighbor-address=*]/connection-state
    outputs:
      - nats-xrd-out

  # BGP message counters (sampled) — XR native YANG
  xrd-bgp-stats:
    mode: stream
    stream-mode: sample
    sample-interval: 30s
    paths:
      - Cisco-IOS-XR-ipv4-bgp-oper:bgp/instances/instance[instance-name=default]/instance-active/default-vrf/neighbors/neighbor[neighbor-address=*]/message-statistics
    outputs:
      - nats-xrd-out

  # MPLS label usage — XR native YANG (richer than OpenConfig for SR)
  # [to validate] — remove path if unsupported on this XRd version
  xrd-mpls-labels:
    mode: stream
    stream-mode: sample
    sample-interval: 30s
    paths:
      - Cisco-IOS-XR-mpls-lsd-oper:mpls-lsd/label-summary
    outputs:
      - nats-xrd-out

  # System health — XR native YANG
  # CPU: Cisco-IOS-XR-wdsysmon-fd-oper not installed on XRd 25.3.1 — omitted
  xrd-system-health:
    mode: stream
    stream-mode: sample
    sample-interval: 30s
    paths:
      - Cisco-IOS-XR-nto-misc-oper:memory-summary/nodes/node[node-name=*]/summary
    outputs:
      - nats-xrd-out

  # PCE topology — XR native YANG (xrd-7 only)
  # topology-summary not available; topology-nodes confirmed working on XRd 25.3.1
  xrd-pce-topology:
    mode: stream
    stream-mode: sample
    sample-interval: 30s
    paths:
      - Cisco-IOS-XR-infra-xtc-oper:pce/topology-nodes
    outputs:
      - nats-xrd-out

outputs:
  nats-xrd-out:
    type: jetstream
    name: gnmic-ingress-xrd
    address: nats:4222
    stream: xrd
    create-stream:
      retention-policy: workqueue
      description: xrd telemetry data to be processed mid pipeline
      subjects: []
      storage: memory
      max-bytes: 268435456
    subject-format: subscription.target
    connect-time-wait: 2s
    format: event
    split-events: false
    override-timestamps: false
    num-workers: 1
    write-timeout: 5s
    debug: false
    buffer-size: 0
    enable-metrics: true
    event-processors: []

api-server:
  address: :7890
  timeout: 10s
  enable-metrics: true
  debug: false
  healthz-disable-logging: true
